<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Moroccan 8-pointed star in Imperial Gold -->
    <rect x="20" y="20" width="40" height="40" stroke="#c29b38" stroke-width="1.8" stroke-opacity="0.75" fill="#c29b38" fill-opacity="0.08" />
    <rect x="20" y="20" width="40" height="40" stroke="#0d7249" stroke-width="1.8" stroke-opacity="0.75" fill="#0d7249" fill-opacity="0.08" transform="rotate(45 40 40)" />
    
    <!-- Central Rosette in Moroccan Royal Red & Gold -->
    <circle cx="40" cy="40" r="7" stroke="#9e1a24" stroke-width="1.8" stroke-opacity="0.8" fill="#c29b38" fill-opacity="0.45" />
    <circle cx="40" cy="40" r="3" fill="#0d7249" fill-opacity="0.8" />
    
    <!-- Moroccan Interlace Straps -->
    <path d="M0,0 L14,14 M80,0 L66,14 M0,80 L14,66 M80,80 L66,66" stroke="#c29b38" stroke-width="1.8" stroke-opacity="0.6" />
    <path d="M40,0 L40,12 M40,68 L40,80 M0,40 L12,40 M68,40 L80,40" stroke="#9e1a24" stroke-width="1.8" stroke-opacity="0.6" />
    
    <!-- Corner Zellij Medallions -->
    <circle cx="0" cy="0" r="9" stroke="#0d7249" stroke-width="1.8" stroke-opacity="0.75" fill="#0d7249" fill-opacity="0.1" />
    <circle cx="80" cy="0" r="9" stroke="#0d7249" stroke-width="1.8" stroke-opacity="0.75" fill="#0d7249" fill-opacity="0.1" />
    <circle cx="0" cy="80" r="9" stroke="#0d7249" stroke-width="1.8" stroke-opacity="0.75" fill="#0d7249" fill-opacity="0.1" />
    <circle cx="80" cy="80" r="9" stroke="#0d7249" stroke-width="1.8" stroke-opacity="0.75" fill="#0d7249" fill-opacity="0.1" />
  </g>
</svg>
